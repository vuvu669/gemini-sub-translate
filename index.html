<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Subtitle Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen py-8 px-4">
    <div class="max-w-4xl mx-auto bg-slate-800 border border-slate-700 shadow-2xl rounded-2xl p-6 md:p-8">
        
        <!-- Header -->
        <div class="mb-6 border-b border-slate-700 pb-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-indigo-400">Gemini Subtitle Studio</h1>
                <p class="text-xs text-slate-400">Chuyên dụng dịch phụ đề .srt / .vtt bằng các mô hình Gemini.</p>
            </div>
            <span id="statusText" class="text-xs px-3 py-1 bg-slate-700 text-slate-300 rounded-full font-medium">Sẵn sàng</span>
        </div>

        <!-- Cấu hình API & Model -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Gemini API Key (Đã tự lưu)</label>
                <input type="password" id="apiKey" placeholder="Dán API Key..." oninput="saveApiKey()"
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Chọn Mô hình</label>
                <select id="modelSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-indigo-500">
                    <optgroup label="Gemini 4.x Series">
                        <option value="gemini-4-argon">Gemini 4 Argon (Flagship)</option>
                    </optgroup>
                    <optgroup label="Gemini 3.x Series">
                        <option value="gemini-3.8-flash" selected>Gemini 3.8 Flash (Khuyên dùng)</option>
                        <option value="gemini-3.6-flash">Gemini 3.6 Flash</option>
                        <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite</option>
                        <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite</option>
                        <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro Preview</option>
                    </optgroup>
                    <optgroup label="Gemini 2.x Series">
                        <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                    </optgroup>
                </select>
            </div>
        </div>

        <!-- System Prompt & Tùy chọn chia Part -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
            <div class="md:col-span-2">
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">System Prompt dịch Sub</label>
                <input type="text" id="customPrompt" value="Bạn là chuyên gia dịch phụ đề. Hãy dịch sang Tiếng Việt tự nhiên, chuẩn văn phong bản ngữ. BẮT BUỘC giữ nguyên định dạng mốc thời gian (00:00:00,000 --> 00:00:00,000) và số thứ tự dòng sub, không giải thích thêm." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Giới hạn ký tự mỗi Part</label>
                <input type="number" id="chunkSize" value="3500" 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-indigo-500">
            </div>
        </div>

        <!-- KHU VỰC NÚT UPLOAD VÀ DOWNLOAD TO RÕ -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <!-- Nút Upload To -->
            <input type="file" id="subFile" accept=".srt,.vtt,.txt" class="hidden">
            <label for="subFile" class="bg-indigo-600 hover:bg-indigo-700 border-2 border-indigo-500 text-white font-semibold py-4 px-6 rounded-xl cursor-pointer text-center flex flex-col items-center justify-center gap-1 transition shadow-lg">
                <span class="text-base">📁 Tải lên file Sub (.srt / .vtt)</span>
                <span class="text-xs font-normal text-indigo-200" id="fileNameDisplay">Bấm để chọn file từ máy tính</span>
            </label>

            <!-- Nút Download To -->
            <button id="downloadBtn" onclick="downloadResult()" disabled
                class="bg-slate-700 border-2 border-slate-600 text-slate-400 font-semibold py-4 px-6 rounded-xl text-center flex flex-col items-center justify-center gap-1 transition shadow-lg cursor-not-allowed">
                <span class="text-base" id="downloadText">📥 Tải xuống file Vietsub</span>
                <span class="text-xs font-normal text-slate-500" id="downloadSubText">Chưa có kết quả dịch</span>
            </button>
        </div>

        <!-- Ô Textarea xem nội dung Gốc & Kết Quả -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Nội dung Sub Gốc</label>
                <textarea id="sourceText" rows="8" placeholder="Hoặc dán nội dung sub trực tiếp vào đây..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs font-mono focus:outline-none focus:border-indigo-500"></textarea>
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Nội dung Sub Kết Quả</label>
                <textarea id="resultBox" rows="8" readonly placeholder="Kết quả dịch sẽ hiện ở đây..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs font-mono text-slate-300 focus:outline-none"></textarea>
            </div>
        </div>

        <!-- Action Button -->
        <button onclick="handleTranslate()" id="translateBtn" 
            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl text-base transition shadow-xl flex items-center justify-center gap-2">
            🚀 Bắt đầu dịch Sub ngay
        </button>

    </div>

    <script>
        let originalFileName = "translated_sub.srt";
        let translatedContent = "";

        // Tự động khôi phục API Key khi load trang
        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('apiKey').value = savedKey;
            }
        });

        // Tự động lưu API Key
        function saveApiKey() {
            const key = document.getElementById('apiKey').value.trim();
            localStorage.setItem('gemini_api_key', key);
        }

        // Xử lý khi chọn file sub
        document.getElementById('subFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            originalFileName = file.name;
            document.getElementById('fileNameDisplay').innerText = `Đã chọn: ${file.name}`;

            const reader = new FileReader();
            reader.onload = function(event) {
                document.getElementById('sourceText').value = event.target.result;
            };
            reader.readAsText(file);
        });

        function splitSubIntoChunks(text, maxChars = 3500) {
            let lines = text.split('\n');
            let chunks = [], currentChunk = '';
            for (let line of lines) {
                if ((currentChunk + line + '\n').length > maxChars) {
                    chunks.push(currentChunk);
                    currentChunk = line + '\n';
                } else {
                    currentChunk += line + '\n';
                }
            }
            if (currentChunk.trim().length > 0) chunks.push(currentChunk);
            return chunks;
        }

        async function translateChunk(textChunk, apiKey, model, customPrompt) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
            const body = {
                contents: [{ parts: [{ text: `${customPrompt}\n\n${textChunk}` }] }]
            };
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error?.message || 'Lỗi API');
            return data.candidates[0].content.parts[0].text;
        }

        async function handleTranslate() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const model = document.getElementById('modelSelect').value;
            const customPrompt = document.getElementById('customPrompt').value.trim();
            const sourceText = document.getElementById('sourceText').value.trim();
            const chunkSize = parseInt(document.getElementById('chunkSize').value) || 3500;
            const resultBox = document.getElementById('resultBox');
            const statusText = document.getElementById('statusText');
            const translateBtn = document.getElementById('translateBtn');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!apiKey) { alert('Vui lòng nhập Gemini API Key!'); return; }
            if (!sourceText) { alert('Vui lòng nhập hoặc tải file sub lên!'); return; }

            translateBtn.disabled = true;
            translateBtn.classList.add('opacity-50', 'cursor-not-allowed');
            downloadBtn.disabled = true;
            downloadBtn.className = "bg-slate-700 border-2 border-slate-600 text-slate-400 font-semibold py-4 px-6 rounded-xl text-center flex flex-col items-center justify-center gap-1 transition shadow-lg cursor-not-allowed";
            document.getElementById('downloadSubText').innerText = "Đang xử lý...";
            resultBox.value = '';

            try {
                let chunks = splitSubIntoChunks(sourceText, chunkSize);
                let translatedResults = [];

                for (let i = 0; i < chunks.length; i++) {
                    statusText.innerText = `Đang dịch Part ${i + 1}/${chunks.length}...`;
                    let res = await translateChunk(chunks[i], apiKey, model, customPrompt);
                    translatedResults.push(res);
                }

                translatedContent = translatedResults.join('\n');
                resultBox.value = translatedContent;
                statusText.innerText = 'Hoàn tất dịch!';

                // Kích hoạt nút download và tự động tải về máy luôn
                downloadBtn.disabled = false;
                downloadBtn.className = "bg-emerald-600 hover:bg-emerald-700 border-2 border-emerald-500 text-white font-semibold py-4 px-6 rounded-xl text-center flex flex-col items-center justify-center gap-1 transition shadow-lg cursor-pointer";
                document.getElementById('downloadSubText').innerText = `Sẵn sàng (${originalFileName})`;
                
                // Tự động gọi hàm tải xuống máy
                downloadResult();

            } catch (error) {
                statusText.innerText = 'Lỗi dịch thuật!';
                resultBox.value = `Lỗi: ${error.message}`;
            } finally {
                translateBtn.disabled = false;
                translateBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        function downloadResult() {
            if (!translatedContent) return;
            const blob = new Blob([translatedContent], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Vietsub_${originalFileName}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
